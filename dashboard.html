<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الضيوف | لَمّة</title><style>*{box-sizing:border-box}body{margin:0;background:#fffaf5;color:#251b17;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:900}a{color:#80543f;text-decoration:none}.hero{margin:30px 0}.hero h1{font-size:38px;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat{background:#fff;border:1px solid #eaded5;border-radius:20px;padding:22px}.stat b{font-size:34px;display:block}.stat span{color:#76655c}.box{background:white;border:1px solid #eaded5;border-radius:24px;overflow:hidden}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:10px;padding:16px 18px;border-bottom:1px solid #f0e7e0;align-items:center}.row.head{font-weight:900;background:#fff7f1}.yes{color:#18794e;font-weight:800}.no{color:#a33b37;font-weight:800}.empty{text-align:center;padding:40px;color:#8a786e}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:0;background:#251b17;color:white;padding:12px 16px;border-radius:13px;font:inherit;font-weight:800}.light{background:#ead8c7;color:#2b201b}@media(max-width:650px){.stats{grid-template-columns:1fr}.row{grid-template-columns:1.3fr .8fr .8fr}.datecol{display:none}}</style></head><body><div class="wrap"><div class="top"><div class="logo">لَمّة</div><a href="invite.html">عرض الدعوة ←</a></div><div class="hero"><h1 id="eventTitle">إدارة الضيوف</h1><p>تابع تأكيدات الحضور والاعتذارات من هنا.</p></div><div class="stats"><div class="stat"><b id="all">0</b><span>إجمالي الردود</span></div><div class="stat"><b id="yes">0</b><span>مؤكدين الحضور</span></div><div class="stat"><b id="no">0</b><span>معتذرين</span></div></div><div class="tools"><button class="btn" onclick="share()">شارك الدعوة واتساب</button><button class="btn light" onclick="clearAll()">مسح الردود التجريبية</button></div><div class="box"><div class="row head"><div>الضيف</div><div>الحالة</div><div>المرافقين</div><div class="datecol">وقت الرد</div></div><div id="list"></div></div></div><script>let d=JSON.parse(localStorage.getItem('lammaInvite')||'{}');let r=JSON.parse(localStorage.getItem('lammaResponses')||'[]');if(d.title)eventTitle.textContent='ضيوف '+d.title;all.textContent=r.length;yes.textContent=r.filter(x=>x.answer==='yes').length;no.textContent=r.filter(x=>x.answer==='no').length;function render(){if(!r.length){list.innerHTML='<div class="empty">ما وصل أي رد للحين.</div>';return}list.innerHTML=r.slice().reverse().map(x=>'<div class="row"><div><b>'+esc(x.name)+'</b></div><div class="'+x.answer+'">'+(x.answer==='yes'?'✓ بحضر':'معتذر')+'</div><div>'+(x.guests||0)+'</div><div class="datecol">'+new Date(x.time).toLocaleString('ar-BH')+'</div></div>').join('')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clearAll(){if(confirm('متأكد تبي تمسح كل الردود؟')){localStorage.setItem('lammaResponses','[]');r=[];all.textContent=yes.textContent=no.textContent=0;render()}}function share(){let u=location.href.replace('dashboard.html','invite.html');location.href='https://wa.me/?text='+encodeURIComponent((d.title||'دعوة من لَمّة')+'\n'+u)}render()</script></body></html>
