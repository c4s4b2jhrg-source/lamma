<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf5"><title>لوحة الضيوف | لَمّة</title><style>*{box-sizing:border-box}body{margin:0;background:#fffaf5;color:#251b17;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}.wrap{max-width:920px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 15px 30px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:30px;font-weight:950}a{color:#80543f;text-decoration:none}.hero{margin:28px 0 18px}.hero h1{font-size:34px;margin:0 0 7px}.hero p{color:#75665e}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{background:#fff;border:1px solid #eaded5;border-radius:19px;padding:18px}.stat b{font-size:30px;display:block}.stat span{color:#76655c;font-size:13px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.btn{border:0;background:#251b17;color:white;padding:13px 14px;border-radius:14px;font:inherit;font-weight:850}.light{background:#ead8c7;color:#2b201b}.search{width:100%;height:54px;border:1px solid #ddcfc5;border-radius:15px;background:#fff;padding:0 15px;font:inherit;font-size:16px;outline:none;margin-bottom:10px}.box{background:white;border:1px solid #eaded5;border-radius:22px;overflow:hidden}.row{display:grid;grid-template-columns:1.3fr .8fr .7fr 1fr;gap:8px;padding:14px;border-bottom:1px solid #f0e7e0;align-items:center}.row.head{font-weight:900;background:#fff7f1;font-size:13px}.yes{color:#18794e;font-weight:850}.no{color:#a33b37;font-weight:850}.empty{text-align:center;padding:38px;color:#8a786e}.mini{display:flex;gap:5px;justify-content:flex-end}.mini button{border:0;border-radius:10px;padding:7px 9px;font:inherit;font-size:12px}.hidebtn{background:#f2e9e2}.delbtn{background:#f5d9d7;color:#8d2424}.hiddenrow{opacity:.48}.notice{background:#fff3d7;border:1px solid #efd498;border-radius:15px;padding:12px 14px;color:#755719;font-size:13px;margin-bottom:12px;display:none}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr 1fr}.stat{padding:14px 10px}.stat b{font-size:25px}.row{grid-template-columns:1.2fr .8fr .6fr}.actionscol{grid-column:1/-1}.row.head .actionscol{display:none}.tools{grid-template-columns:1fr}.hero h1{font-size:30px}}</style></head><body><div class="wrap"><div class="top"><div class="logo">لَمّة</div><a id="viewInvite" href="invite.html">عرض الدعوة ←</a></div><div class="hero"><h1 id="eventTitle">إدارة الضيوف</h1><p>تابع الحضور والاعتذارات من مكان واحد.</p></div><div id="notice" class="notice"></div><div class="stats"><div class="stat"><b id="all">0</b><span>إجمالي الردود</span></div><div class="stat"><b id="yes">0</b><span>بيحضرون</span></div><div class="stat"><b id="no">0</b><span>معتذرين</span></div></div><div class="tools"><button class="btn" onclick="shareInvite()">شارك رابط الدعوة</button><button class="btn light" onclick="refreshData()">تحديث الردود</button></div><input id="search" class="search" placeholder="ابحث باسم الضيف" oninput="render()"><div class="box"><div class="row head"><div>الضيف</div><div>الحالة</div><div>المرافقين</div><div class="actionscol">الإدارة</div></div><div id="list"></div></div></div><script>const $=x=>document.getElementById(x);let admin={},responses=[],event={};try{admin=JSON.parse(localStorage.getItem('lammaAdmin')||'{}')}catch(e){}let u=new URL(location.href),id=u.searchParams.get('id')||admin.id||'',token=u.searchParams.get('token')||admin.token||'';if(id&&token)localStorage.setItem('lammaAdmin',JSON.stringify({id,token}));$('viewInvite').href=id?'invite.html?id='+encodeURIComponent(id):'invite.html';async function refreshData(){if(id&&token){try{let r=await fetch('/api/events?id='+encodeURIComponent(id)+'&action=responses&token='+encodeURIComponent(token),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw 0;responses=j.responses||[];event=j.event||{};$('notice').style.display='none'}catch(e){$('notice').textContent='تعذر تحميل الردود من الخادم. إذا كانت الدعوة تجريبية بنعرض بيانات هذا الجهاز فقط.';$('notice').style.display='block';loadLocal()}}else loadLocal();update();render()}function loadLocal(){try{event=JSON.parse(localStorage.getItem('lammaInvite')||'{}');responses=JSON.parse(localStorage.getItem('lammaResponses')||'[]')}catch(e){responses=[]}}function update(){$('eventTitle').textContent=event.title?'ضيوف '+event.title:'إدارة الضيوف';let visible=responses.filter(x=>!x.hidden);$('all').textContent=visible.length;$('yes').textContent=visible.filter(x=>x.answer==='yes').length;$('no').textContent=visible.filter(x=>x.answer==='no').length}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=$('search').value.trim().toLowerCase(),rows=responses.filter(x=>!q||String(x.name).toLowerCase().includes(q));if(!rows.length){$('list').innerHTML='<div class="empty">ما في نتائج.</div>';return}$('list').innerHTML=rows.slice().reverse().map(x=>'<div class="row '+(x.hidden?'hiddenrow':'')+'"><div><b>'+esc(x.name)+'</b></div><div class="'+x.answer+'">'+(x.answer==='yes'?'✓ بحضر':'معتذر')+'</div><div>'+(x.guests||0)+'</div><div class="actionscol mini"><button class="hidebtn" onclick="toggleHidden(\''+esc(x.id||'')+'\','+(!x.hidden)+')">'+(x.hidden?'إرجاع':'إخفاء')+'</button><button class="delbtn" onclick="hardDelete(\''+esc(x.id||'')+'\')">حذف نهائي</button></div></div>').join('')}async function toggleHidden(rid,val){if(id&&token&&rid){await fetch('/api/events?id='+encodeURIComponent(id)+'&action=response&rid='+encodeURIComponent(rid)+'&token='+encodeURIComponent(token),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({hidden:val})});await refreshData();return}let r=responses.find(x=>x.id===rid);if(r)r.hidden=val;localStorage.setItem('lammaResponses',JSON.stringify(responses));update();render()}async function hardDelete(rid){if(!confirm('حذف نهائي؟ ما تقدر ترجعه.'))return;if(id&&token&&rid){await fetch('/api/events?id='+encodeURIComponent(id)+'&action=response&rid='+encodeURIComponent(rid)+'&token='+encodeURIComponent(token),{method:'DELETE'});await refreshData();return}responses=responses.filter(x=>x.id!==rid);localStorage.setItem('lammaResponses',JSON.stringify(responses));update();render()}async function shareInvite(){let link=id?location.origin+'/invite.html?id='+encodeURIComponent(id):location.origin+'/invite.html';if(navigator.share){try{await navigator.share({title:event.title||'دعوة من لمّة',url:link});return}catch(e){}}location.href='https://wa.me/?text='+encodeURIComponent((event.title||'دعوة من لمّة')+'\n'+link)}refreshData();setInterval(()=>{if(id&&token)refreshData()},15000);</script></body></html>
