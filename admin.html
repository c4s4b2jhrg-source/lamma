<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>أدمن لَمّة</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#271d18;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}.hide{display:none!important}.login{min-height:100svh;display:grid;place-items:center;padding:18px}.loginBox{width:min(420px,100%);background:#fff;border:1px solid #eadfd7;border-radius:28px;padding:24px;box-shadow:0 16px 45px #3a251514}.brand{font-size:30px;font-weight:950}.loginBox h1{margin:12px 0 6px}.loginBox p{margin:0 0 16px;color:#816f65}.input{width:100%;height:58px;border:1.5px solid #decfc5;border-radius:16px;padding:0 15px;font:inherit;font-size:24px;letter-spacing:8px;text-align:center;direction:ltr;outline:none}.loginBtn{width:100%;height:56px;border:0;border-radius:16px;background:#2d211b;color:#fff;font:inherit;font-weight:950;margin-top:10px}.err{font-size:13px;color:#a33d38;margin-top:10px;line-height:1.6}.wrap{max-width:1050px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px 35px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.logout{border:0;background:none;color:#8b5b45;font:inherit;font-weight:850}.hero{margin:24px 0 16px}.hero h1{font-size:30px;margin:0}.hero p{color:#806e64;margin:7px 0 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.stat{background:#fff;border:1px solid #eadfd7;border-radius:19px;padding:15px}.stat b{display:block;font-size:27px}.stat span{font-size:12px;color:#8b786e}.search{width:100%;height:56px;border:1.5px solid #ddcfc5;border-radius:17px;background:#fff;padding:0 15px;font:inherit;font-size:16px;outline:none}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 13px}.tab{height:47px;border:1px solid #ddcfc5;border-radius:14px;background:#fff;font:inherit;font-weight:900}.tab.on{background:#2d211b;color:#fff}.cards{display:grid;gap:11px}.card{background:#fff;border:1px solid #eadfd7;border-radius:23px;padding:16px}.cardTop{display:flex;justify-content:space-between;gap:8px;align-items:center}.id{font-weight:950}.badge{font-size:12px;font-weight:900;padding:6px 10px;border-radius:999px;background:#eaf3ec;color:#237044}.badge.off{background:#f0eae6;color:#776256}.title{font-size:20px;font-weight:950;margin:12px 0}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.m{background:#faf6f3;border-radius:13px;padding:10px}.m small{display:block;color:#8f7d73;margin-bottom:3px}.m b{font-size:14px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.btn{border:0;border-radius:14px;min-height:46px;font:inherit;font-weight:900;padding:9px}.primary{background:#2d211b;color:#fff}.soft{background:#eee1d7;color:#3c2b23}.archive{background:#e9eef8;color:#35588d}.danger{background:#f7dddd;color:#8c2927}.empty{background:#fff;border:1px dashed #d7c8be;border-radius:20px;padding:32px;text-align:center;color:#8c796f}@media(max-width:620px){.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:12px 9px}.stat b{font-size:23px}.meta,.actions{grid-template-columns:1fr 1fr}}</style></head><body><section id="login" class="login"><div class="loginBox"><div class="brand">لَمّة</div><h1>دخول الأدمن</h1><p>اكتب الرقم السري.</p><input id="keyInput" class="input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="••••"><button class="loginBtn" onclick="doLogin()">دخول</button><div id="loginErr" class="err"></div></div></section><main id="app" class="wrap hide"><div class="top"><div class="brand">لَمّة — الأدمن</div><button class="logout" onclick="logout()">تسجيل خروج</button></div><div class="hero"><h1>إدارة الدعوات</h1><p>افتح الدعوة، أرسلها، أو احذفها من مكان واحد.</p></div><div class="stats"><div class="stat"><b id="allCount">0</b><span>الكل</span></div><div class="stat"><b id="activeCount">0</b><span>النشطة</span></div><div class="stat"><b id="archCount">0</b><span>المحذوفة</span></div></div><input id="search" class="search" placeholder="ابحث بالاسم أو رقم الدعوة" oninput="render()"><div class="tabs"><button id="tabActive" class="tab on" onclick="setTab('active')">الدعوات</button><button id="tabArchived" class="tab" onclick="setTab('archived')">المحذوفة</button></div><div id="cards" class="cards"></div></main><script>const $=x=>document.getElementById(x);let key=localStorage.getItem('lammaSuperAdmin')||'',items=[],tab='active';function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,opts={}){const sep=path.includes('?')?'&':'?';const url=path+sep+'key='+encodeURIComponent(key);let r=await fetch(url,opts);let j=await r.json().catch(()=>({error:'تعذر قراءة رد السيرفر'}));if(!r.ok){const e=new Error(j.error||('HTTP '+r.status));e.status=r.status;throw e}return j}async function doLogin(){key=$('keyInput').value.replace(/\D/g,'').slice(0,4);$('keyInput').value=key;$('loginErr').textContent='';if(key.length!==4){$('loginErr').textContent='اكتب الرقم السري من 4 أرقام.';return}try{await load();localStorage.setItem('lammaSuperAdmin',key);showApp()}catch(e){$('loginErr').textContent=e.status===401?'الرقم السري غير صحيح.':'المفتاح صحيح غالبًا، لكن السيرفر رجع خطأ: '+e.message}}$('keyInput').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4)});function showApp(){$('login').classList.add('hide');$('app').classList.remove('hide')}function logout(){localStorage.removeItem('lammaSuperAdmin');location.reload()}async function load(){let j=await api('/api/admin?action=list');items=j.items||[];updateStats();render()}function updateStats(){$('allCount').textContent=items.length;$('activeCount').textContent=items.filter(x=>!x.archived).length;$('archCount').textContent=items.filter(x=>x.archived).length}function setTab(t){tab=t;$('tabActive').classList.toggle('on',t==='active');$('tabArchived').classList.toggle('on',t==='archived');render()}function inviteLink(id){return location.origin+'/invite.html?id='+encodeURIComponent(id)}function render(){let q=$('search').value.trim().toLowerCase(),rows=items.filter(x=>(tab==='archived'?x.archived:!x.archived)&&(!q||String(x.id).toLowerCase().includes(q)||String(x.title||'').toLowerCase().includes(q)||String(x.host||'').toLowerCase().includes(q)));if(!rows.length){$('cards').innerHTML='<div class="empty">ما في دعوات هنا.</div>';return}$('cards').innerHTML=rows.map(x=>`<article class="card"><div class="cardTop"><div class="id">#${esc(x.id)}</div><span class="badge ${x.archived?'off':''}">${x.archived?'محذوفة من اللوحة':'نشطة'}</span></div><div class="title">${esc(x.title||'دعوة بدون عنوان')}</div><div class="meta"><div class="m"><small>صاحب المناسبة</small><b>${esc(x.host||'—')}</b></div><div class="m"><small>التاريخ</small><b>${esc(x.date||'—')} ${esc(x.time||'')}</b></div><div class="m"><small>المكان</small><b>${esc(x.place||'—')}</b></div><div class="m"><small>النوع</small><b>${esc(x.type||'دعوة')}</b></div></div><div class="actions"><button class="btn primary" onclick="openInvite('${esc(x.id)}')">فتح الدعوة</button><button class="btn soft" onclick="sendInvite('${esc(x.id)}','${esc(x.title||'')}')">إرسال للمستلم</button><button class="btn archive" onclick="toggleArchive('${esc(x.id)}',${!x.archived})">${x.archived?'إرجاع للوحة':'حذف من اللوحة'}</button><button class="btn danger" onclick="hardDelete('${esc(x.id)}')">حذف نهائي</button></div></article>`).join('')}function openInvite(id){window.open(inviteLink(id),'_blank','noopener')}function sendInvite(id,title){const msg=(title||'دعوة من لَمّة')+'\n'+inviteLink(id);location.href='https://wa.me/?text='+encodeURIComponent(msg)}async function toggleArchive(id,val){try{await api('/api/admin?action=archive&id='+encodeURIComponent(id),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({archived:val})});let x=items.find(i=>i.id===id);if(x)x.archived=val;updateStats();render()}catch(e){alert(e.message)}}async function hardDelete(id){if(!confirm('حذف نهائي؟ ما تقدر ترجع الدعوة بعدها.'))return;try{await api('/api/admin?action=hard-delete&id='+encodeURIComponent(id),{method:'DELETE'});items=items.filter(x=>x.id!==id);updateStats();render()}catch(e){alert(e.message)}}(async()=>{if(!key)return;try{await load();showApp()}catch(e){localStorage.removeItem('lammaSuperAdmin')}})();</script></body></html>
