<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf5"><title>أدمن لَمّة</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fffaf5;color:#251b17;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}body{min-height:100svh}.wrap{max-width:1100px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px 35px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:30px;font-weight:950}.logout{border:0;background:none;color:#8e5d46;font:inherit;font-weight:800}.hero{margin:22px 0 16px}.hero h1{margin:0 0 6px;font-size:31px}.hero p{margin:0;color:#846f65}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#fff;border:1px solid #eaded5;border-radius:20px;padding:16px}.stat b{display:block;font-size:27px}.stat span{font-size:12px;color:#8a766c}.search{width:100%;height:58px;border:1.5px solid #ddcfc5;border-radius:18px;background:#fff;padding:0 16px;font:inherit;font-size:17px;outline:none}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}.tab{border:1px solid #ddcfc5;background:#fff;height:48px;border-radius:15px;font:inherit;font-weight:900;color:#624f46}.tab.on{background:#2f211b;color:#fff}.cards{display:grid;gap:12px}.card{background:#fff;border:1px solid #eaded5;border-radius:24px;padding:17px;box-shadow:0 8px 24px rgba(56,37,27,.04)}.cardTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.id{font-weight:950;font-size:17px}.badge{padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900;background:#eef3ff;color:#42609a}.badge.arch{background:#f1ece8;color:#745f54}.title{font-size:21px;font-weight:950;margin:12px 0 8px}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.m{background:#faf6f2;border-radius:14px;padding:10px}.m small{display:block;color:#8b796f;margin-bottom:3px}.m b{font-size:14px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.btn{border:0;border-radius:14px;min-height:46px;font:inherit;font-weight:900;padding:10px}.primary{background:#2f211b;color:#fff}.soft{background:#efe3d9;color:#3f2d25}.archive{background:#edf1fb;color:#355a96}.danger{background:#f8dedd;color:#8b2a26}.empty{background:#fff;border:1px dashed #d9c9bf;border-radius:20px;padding:35px;text-align:center;color:#8b786f}.login{min-height:100svh;display:grid;place-items:center;padding:20px}.loginBox{width:min(420px,100%);background:#fff;border:1px solid #eaded5;border-radius:28px;padding:24px}.loginBox h1{margin:0 0 6px}.loginBox p{color:#847168}.loginBox input{width:100%;height:58px;border:1.5px solid #ddcfc5;border-radius:16px;padding:0 15px;font:inherit;font-size:16px;direction:ltr}.loginBox button{width:100%;height:56px;border:0;border-radius:16px;background:#2f211b;color:white;font:inherit;font-weight:950;margin-top:10px}.err{color:#a43c36;font-size:13px;margin-top:8px}.hide{display:none!important}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr 1fr}.stat{padding:13px 10px}.stat b{font-size:24px}.meta{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}.hero h1{font-size:28px}}</style></head><body><section id="login" class="login"><div class="loginBox"><div class="brand">لَمّة</div><h1>دخول الأدمن</h1><p>أدخل مفتاح الأدمن.</p><input id="keyInput" type="password" autocomplete="current-password" placeholder="Admin key"><button onclick="doLogin()">دخول</button><div id="loginErr" class="err"></div></div></section><main id="app" class="wrap hide"><div class="top"><div class="brand">لَمّة — الأدمن</div><button class="logout" onclick="logout()">تسجيل خروج</button></div><div class="hero"><h1>إدارة الدعوات</h1><p>كل الدعوات في مكان واحد.</p></div><div class="stats"><div class="stat"><b id="allCount">0</b><span>كل الدعوات</span></div><div class="stat"><b id="activeCount">0</b><span>النشطة</span></div><div class="stat"><b id="archCount">0</b><span>المحذوفة من اللوحة</span></div></div><input id="search" class="search" placeholder="ابحث بالاسم أو رقم الدعوة" oninput="render()"><div class="tabs"><button id="tabActive" class="tab on" onclick="setTab('active')">الدعوات</button><button id="tabArchived" class="tab" onclick="setTab('archived')">المحذوفة</button></div><div id="cards" class="cards"></div></main><script>const $=x=>document.getElementById(x);let key=localStorage.getItem('lammaSuperAdmin')||'',items=[],tab='active';function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,opts={}){opts.headers={...(opts.headers||{}),'x-lamma-admin':key,'content-type':'application/json'};let r=await fetch(path,opts),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'error');return j}async function doLogin(){key=$('keyInput').value.trim();$('loginErr').textContent='';try{await load();localStorage.setItem('lammaSuperAdmin',key);showApp()}catch(e){$('loginErr').textContent='المفتاح غير صحيح.'}}function showApp(){$('login').classList.add('hide');$('app').classList.remove('hide')}function logout(){localStorage.removeItem('lammaSuperAdmin');location.reload()}async function load(){let j=await api('/api/admin?action=list');items=j.items||[];updateStats();render()}function updateStats(){$('allCount').textContent=items.length;$('activeCount').textContent=items.filter(x=>!x.archived).length;$('archCount').textContent=items.filter(x=>x.archived).length}function setTab(t){tab=t;$('tabActive').classList.toggle('on',t==='active');$('tabArchived').classList.toggle('on',t==='archived');render()}function inviteLink(id){return location.origin+'/invite.html?id='+encodeURIComponent(id)}function render(){let q=$('search').value.trim().toLowerCase(),rows=items.filter(x=>(tab==='archived'?x.archived:!x.archived)&&(!q||String(x.id).toLowerCase().includes(q)||String(x.title).toLowerCase().includes(q)||String(x.host).toLowerCase().includes(q)));if(!rows.length){$('cards').innerHTML='<div class="empty">ما في دعوات هنا.</div>';return}$('cards').innerHTML=rows.map(x=>`<article class="card"><div class="cardTop"><div class="id">#${esc(x.id)}</div><span class="badge ${x.archived?'arch':''}">${x.archived?'محذوف من اللوحة':'نشطة'}</span></div><div class="title">${esc(x.title||'دعوة بدون عنوان')}</div><div class="meta"><div class="m"><small>صاحب المناسبة</small><b>${esc(x.host||'—')}</b></div><div class="m"><small>التاريخ</small><b>${esc(x.date||'—')} ${esc(x.time||'')}</b></div><div class="m"><small>المكان</small><b>${esc(x.place||'—')}</b></div><div class="m"><small>النوع</small><b>${esc(x.type||'دعوة')}</b></div></div><div class="actions"><button class="btn primary" onclick="openInvite('${esc(x.id)}')">فتح الدعوة</button><button class="btn soft" onclick="sendInvite('${esc(x.id)}','${esc(x.title)}')">إرسال للمستلم</button><button class="btn archive" onclick="toggleArchive('${esc(x.id)}',${!x.archived})">${x.archived?'إرجاع للوحة':'حذف من اللوحة'}</button><button class="btn danger" onclick="hardDelete('${esc(x.id)}')">حذف نهائي</button></div></article>`).join('')}function openInvite(id){window.open(inviteLink(id),'_blank','noopener')}function sendInvite(id,title){let link=inviteLink(id),msg=`${title||'دعوة من لَمّة'}\n${link}`;location.href='https://wa.me/?text='+encodeURIComponent(msg)}async function toggleArchive(id,val){await api('/api/admin?action=archive&id='+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({archived:val})});let x=items.find(i=>i.id===id);if(x)x.archived=val;updateStats();render()}async function hardDelete(id){if(!confirm('حذف نهائي؟ بتنحذف الدعوة وردودها وما تقدر ترجعها.'))return;await api('/api/admin?action=hard-delete&id='+encodeURIComponent(id),{method:'DELETE'});items=items.filter(x=>x.id!==id);updateStats();render()}(async()=>{if(!key)return;try{await load();showApp()}catch(e){localStorage.removeItem('lammaSuperAdmin')}})();</script></body></html>
