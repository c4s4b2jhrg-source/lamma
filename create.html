<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أنشئ دعوتك | لَمّة</title><style>*{box-sizing:border-box}body{margin:0;background:#fffaf5;color:#251b17;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}.wrap{max-width:720px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.logo{font-size:28px;font-weight:900}.back{text-decoration:none;color:#76594b}.box{background:white;border:1px solid #eee1d7;border-radius:26px;padding:25px;box-shadow:0 18px 50px #5a2d180d}h1{font-size:34px;margin:0 0 8px}p{color:#75665e;line-height:1.7}label{display:block;font-weight:800;margin:19px 0 8px}input,textarea,select{width:100%;border:1px solid #ddcfc5;background:#fff;padding:14px;border-radius:13px;font:inherit;font-size:16px}textarea{min-height:100px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{width:100%;margin-top:24px;border:0;background:#b66a45;color:white;padding:16px;border-radius:15px;font-size:17px;font-weight:900}.note{text-align:center;font-size:13px;margin-top:15px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="logo">لَمّة</div><a class="back" href="index.html">الرئيسية ←</a></div><div class="box"><h1>سو دعوتك ✨</h1><p>عبّ التفاصيل، وبنسوي لك صفحة دعوة جاهزة للمشاركة.</p><label>نوع المناسبة</label><select id="type"><option>زواج</option><option>تخرج</option><option>عيد ميلاد</option><option>ملكة / عقد قران</option><option>عقيقة</option><option>مناسبة خاصة</option></select><label>عنوان الدعوة</label><input id="title" placeholder="مثال: حفل تخرج علي"><label>رسالة الدعوة</label><textarea id="msg" placeholder="يسعدنا حضوركم ومشاركتنا فرحتنا..."></textarea><div class="grid"><div><label>التاريخ</label><input id="date" type="date"></div><div><label>الوقت</label><input id="time" type="time"></div></div><label>اسم المكان</label><input id="place" placeholder="مثال: قاعة اللؤلؤة"><label>رابط الموقع</label><input id="map" placeholder="رابط Google Maps"><button class="btn" onclick="makeInvite()">إنشاء ومعاينة الدعوة</button><div class="note">تقدر تعدل التفاصيل قبل مشاركة الدعوة.</div></div></div><script>function makeInvite(){const data={type:type.value,title:title.value||'دعوتنا الخاصة',msg:msg.value||'وجودكم يسعدنا ويكمل فرحتنا 🤍',date:date.value,time:time.value,place:place.value||'سيتم تحديد المكان',map:map.value};localStorage.setItem('lammaInvite',JSON.stringify(data));location.href='invite.html'}</script></body></html>
