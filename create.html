<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أنشئ دعوتك | لَمّة</title><style>*{box-sizing:border-box}body{margin:0;background:#fffaf5;color:#251b17;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}.wrap{max-width:820px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.logo{font-size:30px;font-weight:900}.back{color:#76594b;text-decoration:none}.box{background:#fff;border:1px solid #eaded5;border-radius:26px;padding:25px;box-shadow:0 18px 55px #5a2d180d}h1{font-size:34px;margin:0 0 8px}p{color:#75665e;line-height:1.7}label{display:block;font-weight:800;margin:18px 0 8px}input,textarea,select{width:100%;border:1px solid #ddcfc5;background:#fff;padding:14px;border-radius:13px;font:inherit;font-size:16px}textarea{min-height:95px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.theme{border:2px solid transparent;border-radius:18px;padding:18px 8px;text-align:center;font-weight:800;cursor:pointer}.theme input{display:none}.theme:has(input:checked){border-color:#b66a45}.classic{background:#2d1d18;color:#fff}.cream{background:#f1e1cf}.night{background:#151a28;color:#fff}.switchrow{display:flex;align-items:center;justify-content:space-between;background:#fff9f4;border:1px solid #eaded5;padding:14px;border-radius:14px;margin-top:12px}.switchrow input{width:22px;height:22px}.ai{margin-top:28px;padding:22px;border-radius:22px;background:linear-gradient(145deg,#fff7f3,#f7e5df);border:1px solid #e8cfc5}.aihead{display:flex;align-items:center;justify-content:space-between;gap:10px}.aihead h2{margin:0;font-size:25px}.badge{background:#7b3f78;color:#fff;padding:6px 10px;border-radius:999px;font-size:12px}.uploadgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.upload{position:relative;min-height:190px;border:1.5px dashed #c99f8e;border-radius:18px;background:#fff;overflow:hidden;display:grid;place-items:center;text-align:center;padding:14px}.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}.upload img{width:100%;height:190px;object-fit:cover;border-radius:12px;display:none}.styles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.style{border:1px solid #ddcfc5;border-radius:13px;padding:11px 6px;text-align:center;background:white;font-size:13px;font-weight:800;cursor:pointer}.style input{display:none}.style:has(input:checked){border:2px solid #b66a45;background:#fff2eb}.consent{display:flex;gap:9px;align-items:flex-start;margin-top:15px;font-size:13px;color:#6c5b52}.consent input{width:18px;height:18px;margin:0;flex:none}.aibtn{width:100%;border:0;background:linear-gradient(90deg,#a8586d,#c86a79);color:white;padding:15px;border-radius:14px;font:inherit;font-weight:900;margin-top:15px}.aibtn:disabled{opacity:.55}.airesult{display:none;margin-top:16px;text-align:center}.airesult img{width:min(100%,520px);border-radius:20px;box-shadow:0 12px 35px #5a2d1825}.aimsg{margin-top:10px;font-size:14px;color:#76594b}.btn{width:100%;margin-top:24px;border:0;background:#b66a45;color:white;padding:16px;border-radius:15px;font-size:17px;font-weight:900}.note{text-align:center;font-size:13px;margin-top:15px}@media(max-width:600px){.grid,.uploadgrid{grid-template-columns:1fr}.themes{grid-template-columns:1fr}.styles{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="top"><div class="logo">لَمّة</div><a class="back" href="index.html">الرئيسية ←</a></div><div class="box"><h1>سو دعوتك ✨</h1><p>عبّ التفاصيل واختر الشكل، وبنعرض لك الدعوة جاهزة للمشاركة.</p><label>نوع المناسبة</label><select id="type"><option>زواج</option><option>ملكة / عقد قران</option><option>تخرج</option><option>عيد ميلاد</option><option>مولود / عقيقة</option><option>رمضان / عزيمة</option><option>مناسبة خاصة</option></select><label>عنوان الدعوة</label><input id="title" placeholder="مثال: زواج سارة ومحمد"><label>رسالة الدعوة</label><textarea id="msg" placeholder="يسعدنا حضوركم ومشاركتنا فرحتنا..."></textarea><div class="grid"><div><label>التاريخ</label><input id="date" type="date"></div><div><label>الوقت</label><input id="time" type="time"></div></div><label>اسم المكان</label><input id="place" placeholder="مثال: قاعة اللؤلؤة"><label>رابط الموقع</label><input id="map" placeholder="رابط Google Maps"><label>اسم صاحب المناسبة</label><input id="host" placeholder="مثال: عائلة أحمد"><label>عدد المرافقين المسموح</label><select id="guests"><option value="0">بدون مرافق</option><option value="1">مرافق واحد</option><option value="2">مرافقان</option><option value="3">حتى 3 مرافقين</option><option value="5">حتى 5 مرافقين</option></select><label>اختر التصميم</label><div class="themes"><label class="theme classic"><input type="radio" name="theme" value="classic" checked>فخم كلاسيك</label><label class="theme cream"><input type="radio" name="theme" value="cream">كريمي هادئ</label><label class="theme night"><input type="radio" name="theme" value="night">ليلي فاخر</label></div><div class="switchrow"><span><b>إظهار عداد المناسبة</b><br><small>يبين للضيف كم باقي</small></span><input id="countdown" type="checkbox" checked></div><section class="ai"><div class="aihead"><div><h2>رحلة تجمعنا ✨</h2><p style="margin:5px 0 0">ارفع صورتين من الطفولة، والذكاء الاصطناعي يصنع لكم لقطة واحدة كأنكم كنتم مع بعض.</p></div><span class="badge">AI</span></div><div class="uploadgrid"><label class="upload"><div id="boyText">📷<br><b>صورته وهو صغير</b><br><small>اضغط لاختيار الصورة</small></div><img id="boyPreview"><input id="boyPhoto" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewFile(this,'boyPreview','boyText')"></label><label class="upload"><div id="girlText">📷<br><b>صورتها وهي صغيرة</b><br><small>اضغط لاختيار الصورة</small></div><img id="girlPreview"><input id="girlPhoto" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewFile(this,'girlPreview','girlText')"></label></div><label>ستايل الصورة</label><div class="styles"><label class="style"><input type="radio" name="aistyle" value="واقعي دافئ" checked>واقعي 🤍</label><label class="style"><input type="radio" name="aistyle" value="طفولي ناعم">طفولي ✨</label><label class="style"><input type="radio" name="aistyle" value="سينمائي فاخر">سينمائي 🎞️</label><label class="style"><input type="radio" name="aistyle" value="رسوم كرتونية لطيفة">كرتوني 🎨</label></div><label class="consent"><input id="consent" type="checkbox"><span>أؤكد أن لدي إذن لاستخدام الصورتين لإنشاء هذه الصورة.</span></label><button id="aiBtn" class="aibtn" type="button" onclick="generateAI()">✨ توليد صورتنا بالذكاء الاصطناعي</button><div id="aiResult" class="airesult"><img id="aiImage"><div id="aiMsg" class="aimsg"></div></div></section><button class="btn" onclick="makeInvite()">إنشاء ومعاينة الدعوة</button><div class="note">بعد المعاينة تقدر تشارك الرابط وتدخل لوحة إدارة الضيوف.</div></div></div><script>const old=JSON.parse(localStorage.getItem('lammaInvite')||'{}');['type','title','msg','date','time','place','map','host','guests'].forEach(k=>{if(old[k]!=null&&document.getElementById(k))document.getElementById(k).value=old[k]});if(old.theme){const r=document.querySelector('input[name=theme][value="'+old.theme+'"]');if(r)r.checked=true}if(old.countdown===false)countdown.checked=false;if(old.aiImage){aiImage.src=old.aiImage;aiResult.style.display='block';aiMsg.textContent='الصورة محفوظة في دعوتك 🤍'}function previewFile(input,imgId,textId){const f=input.files[0];if(!f)return;const img=document.getElementById(imgId),txt=document.getElementById(textId);img.src=URL.createObjectURL(f);img.style.display='block';txt.style.display='none'}async function generateAI(){const a=boyPhoto.files[0],b=girlPhoto.files[0];if(!a||!b)return alert('ارفع الصورتين أول 🤍');if(!consent.checked)return alert('أكد إذن استخدام الصورتين أول');const btn=aiBtn;btn.disabled=true;btn.textContent='جاري صنع الصورة... ✨';aiResult.style.display='block';aiMsg.textContent='قد تستغرق العملية شوي';try{const fd=new FormData();fd.append('image1',a);fd.append('image2',b);fd.append('style',document.querySelector('input[name=aistyle]:checked').value);const r=await fetch('/api/ai-couple',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error||'تعذر توليد الصورة');const raw='data:image/png;base64,'+j.image;const small=await compressImage(raw);aiImage.src=small;old.aiImage=small;old.aiStyle=document.querySelector('input[name=aistyle]:checked').value;localStorage.setItem('lammaInvite',JSON.stringify({...JSON.parse(localStorage.getItem('lammaInvite')||'{}'),aiImage:small,aiStyle:old.aiStyle}));aiMsg.textContent='تم ✨ وراح تظهر داخل الدعوة';}catch(e){aiMsg.textContent=e.message||'تعذر توليد الصورة';}finally{btn.disabled=false;btn.textContent='✨ توليد صورة ثانية'}}function compressImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const max=900,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.onerror=rej;im.src=src})}function makeInvite(){let previous={};try{previous=JSON.parse(localStorage.getItem('lammaInvite')||'{}')}catch(e){}const data={type:type.value,title:title.value||'دعوتنا الخاصة',msg:msg.value||'وجودكم يسعدنا ويكمل فرحتنا 🤍',date:date.value,time:time.value,place:place.value||'سيتم تحديد المكان',map:map.value,host:host.value,guests:Number(guests.value),theme:document.querySelector('input[name=theme]:checked').value,countdown:countdown.checked,aiImage:previous.aiImage||'',aiStyle:previous.aiStyle||''};localStorage.setItem('lammaInvite',JSON.stringify(data));if(!localStorage.getItem('lammaResponses'))localStorage.setItem('lammaResponses','[]');location.href='invite.html'}</script></body></html>
