<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أنشئ دعوتك | لَمّة</title><style>*{box-sizing:border-box}body{margin:0;background:#fffaf5;color:#251b17;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.logo{font-size:30px;font-weight:900}.back{color:#76594b;text-decoration:none}.box{background:#fff;border:1px solid #eaded5;border-radius:26px;padding:25px;box-shadow:0 18px 55px #5a2d180d}h1{font-size:34px;margin:0 0 8px}p{color:#75665e;line-height:1.7}label{display:block;font-weight:800;margin:18px 0 8px}input,textarea,select{width:100%;border:1px solid #ddcfc5;background:#fff;padding:14px;border-radius:13px;font:inherit;font-size:16px}textarea{min-height:95px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.theme{border:2px solid transparent;border-radius:18px;padding:18px 8px;text-align:center;font-weight:800;cursor:pointer}.theme input{display:none}.theme:has(input:checked){border-color:#b66a45}.classic{background:#2d1d18;color:#fff}.cream{background:#f1e1cf}.night{background:#151a28;color:#fff}.switchrow{display:flex;align-items:center;justify-content:space-between;background:#fff9f4;border:1px solid #eaded5;padding:14px;border-radius:14px;margin-top:12px}.switchrow input{width:22px;height:22px}.btn{width:100%;margin-top:24px;border:0;background:#b66a45;color:white;padding:16px;border-radius:15px;font-size:17px;font-weight:900}.note{text-align:center;font-size:13px;margin-top:15px}@media(max-width:600px){.grid{grid-template-columns:1fr}.themes{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="logo">لَمّة</div><a class="back" href="index.html">الرئيسية ←</a></div><div class="box"><h1>سو دعوتك ✨</h1><p>عبّ التفاصيل واختر الشكل، وبنعرض لك الدعوة جاهزة للمشاركة.</p><label>نوع المناسبة</label><select id="type"><option>زواج</option><option>ملكة / عقد قران</option><option>تخرج</option><option>عيد ميلاد</option><option>مولود / عقيقة</option><option>رمضان / عزيمة</option><option>مناسبة خاصة</option></select><label>عنوان الدعوة</label><input id="title" placeholder="مثال: حفل تخرج علي"><label>رسالة الدعوة</label><textarea id="msg" placeholder="يسعدنا حضوركم ومشاركتنا فرحتنا..."></textarea><div class="grid"><div><label>التاريخ</label><input id="date" type="date"></div><div><label>الوقت</label><input id="time" type="time"></div></div><label>اسم المكان</label><input id="place" placeholder="مثال: قاعة اللؤلؤة"><label>رابط الموقع</label><input id="map" placeholder="رابط Google Maps"><label>اسم صاحب المناسبة</label><input id="host" placeholder="مثال: عائلة أحمد"><label>عدد المرافقين المسموح</label><select id="guests"><option value="0">بدون مرافق</option><option value="1">مرافق واحد</option><option value="2">مرافقان</option><option value="3">حتى 3 مرافقين</option><option value="5">حتى 5 مرافقين</option></select><label>اختر التصميم</label><div class="themes"><label class="theme classic"><input type="radio" name="theme" value="classic" checked>فخم كلاسيك</label><label class="theme cream"><input type="radio" name="theme" value="cream">كريمي هادئ</label><label class="theme night"><input type="radio" name="theme" value="night">ليلي فاخر</label></div><div class="switchrow"><span><b>إظهار عداد المناسبة</b><br><small>يبين للضيف كم باقي</small></span><input id="countdown" type="checkbox" checked></div><button class="btn" onclick="makeInvite()">إنشاء ومعاينة الدعوة</button><div class="note">بعد المعاينة تقدر تشارك الرابط وتدخل لوحة إدارة الضيوف.</div></div></div><script>const old=JSON.parse(localStorage.getItem('lammaInvite')||'{}');['type','title','msg','date','time','place','map','host','guests'].forEach(k=>{if(old[k]!=null&&document.getElementById(k))document.getElementById(k).value=old[k]});if(old.theme){const r=document.querySelector('input[name=theme][value="'+old.theme+'"]');if(r)r.checked=true}if(old.countdown===false)countdown.checked=false;function makeInvite(){const data={type:type.value,title:title.value||'دعوتنا الخاصة',msg:msg.value||'وجودكم يسعدنا ويكمل فرحتنا 🤍',date:date.value,time:time.value,place:place.value||'سيتم تحديد المكان',map:map.value,host:host.value,guests:Number(guests.value),theme:document.querySelector('input[name=theme]:checked').value,countdown:countdown.checked};localStorage.setItem('lammaInvite',JSON.stringify(data));if(!localStorage.getItem('lammaResponses'))localStorage.setItem('lammaResponses','[]');location.href='invite.html'}</script></body></html>
