<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دعوة | لَمّة</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;display:grid;place-items:center;padding:22px;transition:.3s}.classic{background:linear-gradient(145deg,#261b17,#493126);color:#fff}.cream{background:linear-gradient(145deg,#fff9f2,#ead8c5);color:#2c211c}.night{background:linear-gradient(145deg,#0e1220,#20283f);color:#fff}.card{width:min(660px,100%);text-align:center;border-radius:32px;padding:42px 24px;box-shadow:0 25px 80px #0004}.classic .card,.night .card{border:1px solid #ffffff25;background:#ffffff0d;backdrop-filter:blur(10px)}.cream .card{border:1px solid #d9c2ad;background:#fff9}.brand{font-weight:900;letter-spacing:1px;margin-bottom:30px}.small,.muted{opacity:.72}.type{display:inline-block;background:#ffffff18;border:1px solid #ffffff20;border-radius:999px;padding:8px 15px;margin-bottom:14px}.cream .type{background:#ead6c2;border-color:#dcc3aa}h1{font-size:clamp(34px,8vw,54px);margin:10px 0 15px}.msg{font-size:18px;line-height:1.9;white-space:pre-wrap;opacity:.9}.host{margin-top:10px;font-weight:700;opacity:.8}.story{display:none;margin:30px auto 6px;max-width:540px}.storytag{font-size:13px;opacity:.72;margin-bottom:10px}.storyimg{width:100%;border-radius:24px;display:block;box-shadow:0 18px 50px #0005;border:1px solid #ffffff25}.storycap{font-size:19px;font-weight:800;line-height:1.8;margin:14px 0 0}.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:26px 0}.unit{padding:12px 4px;border-radius:15px;background:#ffffff12}.cream .unit{background:#ead8c7}.unit b{display:block;font-size:23px}.details{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:25px 0}.detail{background:#fff;color:#2b201b;padding:12px 15px;border-radius:14px;font-weight:700}.rsvp{margin-top:28px;padding-top:24px;border-top:1px solid #ffffff20}.cream .rsvp{border-color:#d9c2ad}.rsvp h3{margin:0 0 14px}.name,.guestsel{width:100%;border:0;background:#fff;color:#2b201b;padding:14px;border-radius:14px;font:inherit;margin-bottom:10px}.actions,.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn,a.btn{border:0;padding:14px 18px;border-radius:14px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}.yes{background:#d6ad92;color:#2b201b}.no{background:#ffffff18;color:inherit;border:1px solid #ffffff25}.cream .no{background:#ead8c7}.tool{background:#fff;color:#2b201b}.status{min-height:28px;margin-top:16px;font-weight:700}.tools{margin-top:22px}.edit{display:block;margin-top:25px;color:inherit;opacity:.65;font-size:14px}.dashboard{display:inline-block;margin-top:12px;color:inherit;font-weight:800}.hide{display:none}@media(max-width:480px){.count{grid-template-columns:repeat(2,1fr)}.card{padding:35px 18px}}</style></head><body><div class="card"><div class="brand">لَمّة ✦</div><div class="type" id="type">دعوة خاصة</div><div class="small">بكل حب ندعوكم لحضور</div><h1 id="title">دعوتنا الخاصة</h1><div class="msg" id="msg">وجودكم يسعدنا ويكمل فرحتنا 🤍</div><div class="host" id="host"></div><div id="story" class="story"><div class="storytag">✨ رحلة تجمعنا بالذكاء الاصطناعي</div><img id="storyImg" class="storyimg" alt="صورتنا"><div class="storycap">من أيام الطفولة… إلى يوم جمعنا القدر 🤍</div></div><div id="counter" class="count hide"><div class="unit"><b id="days">0</b>يوم</div><div class="unit"><b id="hours">0</b>ساعة</div><div class="unit"><b id="mins">0</b>دقيقة</div><div class="unit"><b id="secs">0</b>ثانية</div></div><div class="details"><div class="detail" id="date">📅 الموعد</div><div class="detail" id="time">🕗 الوقت</div><div class="detail" id="place">📍 المكان</div></div><div class="tools"><a id="map" class="btn tool hide" target="_blank">📍 افتح الموقع</a><button class="btn tool" onclick="addCalendar()">📅 أضف للتقويم</button><button class="btn tool" onclick="shareInvite()">↗ مشاركة</button></div><div class="rsvp"><h3>هل بتشرفنا؟ 🤍</h3><input class="name" id="guestName" placeholder="اكتب اسمك"><select class="guestsel hide" id="guestCount"></select><div class="actions"><button class="btn yes" onclick="reply('yes')">✓ بأحضر</button><button class="btn no" onclick="reply('no')">أعتذر</button></div><div class="status" id="status"></div></div><a class="dashboard" href="dashboard.html">لوحة إدارة الضيوف ←</a><a class="edit" href="create.html">تعديل الدعوة</a></div><script>let d={};try{d=JSON.parse(localStorage.getItem('lammaInvite')||'{}')}catch(e){};document.body.className=d.theme||'classic';if(d.type)type.textContent=d.type;if(d.title){title.textContent=d.title;document.title=d.title+' | لَمّة'}if(d.msg)msg.textContent=d.msg;if(d.host)host.textContent='بدعوة من '+d.host;if(d.aiImage){storyImg.src=d.aiImage;story.style.display='block'}if(d.date)date.textContent='📅 '+new Date(d.date+'T00:00:00').toLocaleDateString('ar-BH',{weekday:'long',year:'numeric',month:'long',day:'numeric'});if(d.time)time.textContent='🕗 '+d.time;if(d.place)place.textContent='📍 '+d.place;if(d.map){map.href=d.map;map.classList.remove('hide')}if(d.guests>0){guestCount.classList.remove('hide');for(let i=0;i<=d.guests;i++){let o=document.createElement('option');o.value=i;o.textContent=i===0?'بدون مرافق':i===1?'معي مرافق واحد':'معي '+i+' مرافقين';guestCount.appendChild(o)}}if(d.countdown&&d.date){counter.classList.remove('hide');setInterval(tick,1000);tick()}function tick(){let t=new Date(d.date+'T'+(d.time||'00:00')).getTime()-Date.now();if(t<0)t=0;days.textContent=Math.floor(t/86400000);hours.textContent=Math.floor(t%86400000/3600000);mins.textContent=Math.floor(t%3600000/60000);secs.textContent=Math.floor(t%60000/1000)}function reply(answer){let n=guestName.value.trim();if(!n){status.textContent='اكتب اسمك أول 🤍';return}let arr=[];try{arr=JSON.parse(localStorage.getItem('lammaResponses')||'[]')}catch(e){}arr.push({name:n,answer,guests:Number(guestCount.value||0),time:new Date().toISOString()});localStorage.setItem('lammaResponses',JSON.stringify(arr));status.textContent=answer==='yes'?'تم تأكيد حضورك 🤍 ننتظرك!':'وصلنا اعتذارك، نشوفك على خير 🤍'}function shareInvite(){let text=(d.title||'دعوة من لَمّة')+'\n'+location.href;if(navigator.share)navigator.share({title:d.title||'دعوة',text:d.msg||'',url:location.href});else location.href='https://wa.me/?text='+encodeURIComponent(text)}function addCalendar(){if(!d.date)return alert('أضف تاريخ المناسبة أول');let start=(d.date.replaceAll('-','')+'T'+(d.time||'00:00').replace(':','')+'00');let end=start;let u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(d.title||'مناسبة')+'&dates='+start+'/'+end+'&details='+encodeURIComponent(d.msg||'')+'&location='+encodeURIComponent(d.place||'');window.open(u,'_blank')}</script></body></html>
