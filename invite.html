<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دعوة | لَمّة</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#261b17,#493126);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;display:grid;place-items:center;padding:22px}.card{width:min(620px,100%);text-align:center;border:1px solid #ffffff25;background:#ffffff0d;backdrop-filter:blur(10px);border-radius:30px;padding:45px 25px;box-shadow:0 25px 80px #0005}.brand{font-weight:900;color:#ddb89f;margin-bottom:40px}.small{color:#d9c7bb}.type{display:inline-block;background:#ffffff12;border-radius:999px;padding:8px 15px;margin-bottom:14px}h1{font-size:clamp(34px,8vw,54px);margin:10px 0 15px}.msg{font-size:18px;line-height:1.9;color:#eee0d8;white-space:pre-wrap}.details{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:28px 0}.detail{background:#fff;color:#2b201b;padding:12px 16px;border-radius:14px;font-weight:700}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{border:0;padding:14px 20px;border-radius:14px;font:inherit;font-weight:800;cursor:pointer}.yes{background:#d6ad92;color:#2b201b}.no{background:#ffffff15;color:white}.map{display:inline-block;margin-top:20px;color:#eac8b1}.status{min-height:28px;margin-top:20px;color:#eac8b1}.edit{display:block;margin-top:30px;color:#cdb9ad;font-size:14px}</style></head><body><div class="card"><div class="brand">لَمّة ✦</div><div class="type" id="type">دعوة خاصة</div><div class="small">بكل حب ندعوكم لحضور</div><h1 id="title">دعوتنا الخاصة</h1><div class="msg" id="msg">وجودكم يسعدنا ويكمل فرحتنا 🤍</div><div class="details"><div class="detail" id="date">📅 الموعد</div><div class="detail" id="time">🕗 الوقت</div><div class="detail" id="place">📍 المكان</div></div><div class="actions"><button class="btn yes" onclick="reply('تم تأكيد حضورك 🤍 ننتظرك!')">✓ بأحضر</button><button class="btn no" onclick="reply('وصلنا اعتذارك، نشوفك على خير 🤍')">أعتذر</button></div><a id="map" class="map" target="_blank" style="display:none">فتح الموقع على الخريطة ↗</a><div class="status" id="status"></div><a class="edit" href="create.html">تعديل الدعوة</a></div><script>let d={};try{d=JSON.parse(localStorage.getItem('lammaInvite')||'{}')}catch(e){};if(d.type)type.textContent=d.type;if(d.title)title.textContent=d.title;if(d.msg)msg.textContent=d.msg;if(d.date)date.textContent='📅 '+new Date(d.date+'T00:00:00').toLocaleDateString('ar-BH',{year:'numeric',month:'long',day:'numeric'});if(d.time)time.textContent='🕗 '+d.time;if(d.place)place.textContent='📍 '+d.place;if(d.map){map.href=d.map;map.style.display='inline-block'}function reply(t){status.textContent=t}</script></body></html>
